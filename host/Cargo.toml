[package]
name = "mcp-host"
description = "The tool host: one process serving every session's MCP tools."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

# Its binaries hold no tests of their own, so `cargo test` links no test binary of them: the host, and the
# registry's command, which `bmo pocket` hands its words to.
[[bin]]
name = "mcp-host"
path = "src/main.rs"
test = false

[[bin]]
name = "bmo-pocket"
path = "src/bin/bmo-pocket.rs"
test = false

[dependencies]
axum.workspace = true
base64.workspace = true
# The control socket's wire types, which the host answers with and the OpenAPI document is generated from.
bmo-pocket-client = { path = "../client" }
# The harness plugin, which `bmo-pocket mcp` serves.
bmo-pocket-plugin = { path = "../plugin" }
bmo-tool = { path = "../sdk/contract" }
# The console face by bmo-ui's console contract: the manifest, the bundle's files and the screens' guard.
bmo-console-face = { path = "../../../base/chat/console-face" }
# A schedule's time, in the machine's local zone, and its pattern's next one.
chrono.workspace = true
clap.workspace = true
croner.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
dotenvy.workspace = true
hyper.workspace = true
hyper-util.workspace = true
jsonschema.workspace = true
libc.workspace = true
notify.workspace = true
rand.workspace = true
rmcp = { workspace = true, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# A shared skill's front matter read as a share checks it (docs/catalogue.md, 「Kinds」).
serde_norway.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
# A manifest's tool name, read before the manifest is read whole under it.
toml.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
