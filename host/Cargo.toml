[package]
name = "mcp-host"
description = "The tool host: one process serving every session's MCP tools."
version.workspace = true
edition.workspace = true
publish.workspace = true

# Its binary holds no tests of its own, so `cargo test` links no test binary of it.
[[bin]]
name = "mcp-host"
path = "src/main.rs"
test = false

[dependencies]
axum.workspace = true
bmo-tool = { path = "../sdk/contract" }
clap.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
jsonschema.workspace = true
libc.workspace = true
notify.workspace = true
rand.workspace = true
# The account service the grant lock asks, over HTTP.
reqwest.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
