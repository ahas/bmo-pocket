[package]
name = "mcp-host"
description = "The tool host: one process serving every session's MCP tools."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Its binaries hold no tests of their own, so `cargo test` links no test binary of them: the host, and the
# registry's command, which `bmo pocket` hands its words to.
[[bin]]
name = "mcp-host"
path = "src/main.rs"
test = false

[[bin]]
name = "bmo-pocket"
path = "src/bin/bmo-pocket.rs"
test = false

[dependencies]
axum.workspace = true
# The control socket's wire types, which the host answers with and the OpenAPI document is generated from.
bmo-pocket-client = { path = "../client" }
# The harness plugin, which `bmo-pocket mcp` serves.
bmo-pocket-plugin = { path = "../plugin" }
bmo-tool = { path = "../sdk/contract" }
# A schedule's time, in the machine's local zone, and its pattern's next one.
chrono.workspace = true
clap.workspace = true
croner.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
jsonschema.workspace = true
libc.workspace = true
notify.workspace = true
rand.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
# A manifest's tool name, read before the manifest is read whole under it.
toml.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
