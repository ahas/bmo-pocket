[package]
name = "bmo-tool"
description = "The contract every tool of the tool host is written to."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[dependencies]
# A schedule's cron pattern, read as the manifest is.
croner.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# A call reaches its call-back socket and its shared helpers over a unix socket, one line each way.
tokio.workspace = true
toml.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
