[package]
name = "bmo-pocket-plugin"
description = "The tool host's harness plugin: the MCP server `bmo-pocket mcp` serves over standard input and output, each tool a call through bmo-pocket-client, and the bmo-pocket skill."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[dependencies]
bmo-pocket-client = { path = "../client" }
# The MCP server, spoken over standard input and output.
rmcp = { workspace = true, features = ["transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
