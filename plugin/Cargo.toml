[package]
name = "bmo-pocket-plugin"
description = "The tool host's harness plugin: the MCP server `bmo-pocket mcp` serves over standard input and output, each tool a call through bmo-pocket-client, and the ahas-pocket skill."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bmo-pocket-client = { path = "../client" }
# The MCP server, spoken over standard input and output.
rmcp = { workspace = true, features = ["transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "sync"] }

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "time"] }
