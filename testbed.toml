# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.

testbed = 0
name = "pocket"

[test]
# The Cargo workspace's crates; the TypeScript tool kit's tests, which run from its own folder and hold the
# Python kit to the same cases; the TypeScript client's, which run against the workspace's build of the host and
# hold its types to docs/openapi.json; the console screen's, whose console face test runs against the same build
# and reads the manifest through bmo-ui's own reading; and the host's contract with an installed CLI, which runs
# where BMO_LIVE_CLAUDE names one.
languages = ["cargo", "bun"]
files = [
  "sdk/ts-kit/tests/**/*.test.ts",
  "client/tests/**/*.test.ts",
  "console/tests/**/*.test.ts",
  "tests/host-contract/**/*.test.ts",
]
setup = [
  "cd sdk/ts-kit && bun install --frozen-lockfile",
  "cd client && bun install --frozen-lockfile",
  "cd console && bun install --frozen-lockfile",
  "cd tests/host-contract && bun install --frozen-lockfile",
]

[check]
quick = ["layout", "dependencies"]
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui"]

[[check.step]]
id = "check"
command = "cargo check --workspace --all-targets"
lane = "wide"

[[check.step]]
id = "clippy"
command = "cargo clippy --workspace --all-targets -- -D warnings"
lane = "wide"

[[check.step]]
id = "fmt"
command = "cargo fmt --all --check"

# The console screen under console/, a Bun project of its own: its typecheck, against its own install.
[[check.step]]
id = "console-typecheck"
dir = "console"
command = "bun install --frozen-lockfile && bun run typecheck"
lane = "wide"

# The tool host's own deploy tree, and the data root it shares with the services whose tools it serves. The
# host's user unit stands under deploy/ and is the repository's one service.
[build]
binaries = ["mcp-host", "bmo-pocket"]

# The console bundle the console face serves (docs/api.md, 「The bundle」), built in the build tree, where its
# install and Nuxt's generated project stay warm between deployments, and written before the flip into the release
# being built: the release beside the build tree, named by the first twelve hex digits of the commit. Its
# console-bundle/, a folder apart from the screen's sources in console/, is the one the host reads its bundle from
# where `--console-bundle` names none, read once as it starts.
[[build.step]]
id = "console-install"
dir = "console"
command = "bun install --frozen-lockfile"

[[build.step]]
id = "console-bundle"
dir = "console"
lane = "wide"
command = "BMO_POCKET_CONSOLE_OUT=\"$(git rev-parse --show-toplevel)/../deploy-releases/$(git rev-parse HEAD | cut -c1-12)/console-bundle\" bun run bundle"

[deploy]
root = "~/.local/share/bmo-pocket"
link = "deploy"
data_root = "~/.local/share/bmo/data"
units = ["deploy/*.service"]
# Answers 0 once the host answers on its control socket, under the issuer token the host writes
# under the data root at its first start.
health = 'curl -sf -H "Authorization: Bearer $(cat "${BMO_DATA_DIR:-$HOME/.local/share/bmo/data}/tool-host/issuer-token")" --unix-socket "${XDG_RUNTIME_DIR:-/tmp}/bmo/mcp-host.sock" http://localhost/health'
# Answers 0 where no chat turn or research run stands under way that the restart would cut: the receiver's
# own `quiet` command, by its deployed path, waited on before the flip (the testbed's docs/deploy.md).
quiet = "~/.local/share/bmo-receiver/deploy/bin/bmo-receiver --config ~/.local/share/bmo-receiver/deploy/settings.toml quiet"

# The CLI, linked into the folder holding `bmo`, the first folder `bmo` looks for unit commands in, so `bmo
# pocket <verb>` and the `tool` nouns are served wherever `bmo` is (docs/api.md, "The CLI"). The link names this
# repository's deploy tree, whose own link stands across releases; a link made to the release being deployed
# would dangle once a later deployment prunes that release.
[[deploy.step]]
id = "link-unit-command"
phase = "before-flip"
command = '''
set -eu
bmo_dir="$(dirname "$(command -v bmo)")"
ln -sfn "$HOME/.local/share/bmo-pocket/deploy/bin/bmo-pocket" "$bmo_dir/bmo-pocket"
'''
