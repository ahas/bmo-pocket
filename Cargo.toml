# The workspace: the tool host under `host/`, the tool contract every Rust tool is written to under
# `sdk/contract/`, the control socket's client under `client/`, the harness plugin under `plugin/`, the example
# tool in Rust under `examples/count-words-rust/`, and the repository's own package at the root, which holds the
# checks that span the repository in `tests/`, the example tools put and called among them.
[workspace]
members = ["client", "examples/count-words-rust", "host", "plugin", "sdk/contract"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
# A screen's file, carried in base64 on the runner's passage.
base64 = "0.22.1"
# A schedule's time, in the host machine's local zone.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.40", features = ["derive", "env", "string"] }
# A schedule's cron pattern, read and its next time found.
croner = "4.0.1"
# The event stream's body, unfolded from the events as they are published.
futures-util = { version = "0.3.34", default-features = false }
http = "1.3.1"
http-body-util = "0.1.3"
hyper = { version = "1.12.0", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "client-proxy", "client-proxy-system", "http1", "http2", "server", "service", "tokio"] }
dotenvy = "0.15.7"
jsonschema = { version = "0.58.6", default-features = false }
libc = "0.2.177"
notify = { version = "8.2.0", default-features = false }
rand = "0.9.2"
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
# A skill's front matter, YAML (docs/catalogue.md, 「Kinds」).
serde_norway = "0.9.42"
strum = { version = "0.28.0", features = ["derive"] }
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.18"
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
url = "2.5.8"

[package]
name = "bmo-pocket"
description = "The tool host repository's own package: the checks that span the repository."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[dev-dependencies]
# The session record the example tools are called under.
bmo-tool = { path = "sdk/contract" }
# The registry and the host the example tools are put into and called through, as `bmo-pocket put` and a session
# reach them.
mcp-host = { path = "host" }
# The workspace's packages as `cargo metadata` answers them, the other manifests a project carries, and the example
# tools' answers.
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
debug = false
strip = "debuginfo"
