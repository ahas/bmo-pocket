# The workspace: the tool host under `host/`, the tool contract every Rust tool is written to under
# `sdk/contract/`, and the repository's own package at the root, which holds the checks that span the
# repository in `tests/`.
[workspace]
members = ["host", "sdk/contract"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde_json = "1.0.138"
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[package]
name = "bmo-pocket"
description = "The tool host repository's own package: the checks that span the repository."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dev-dependencies]
# The workspace's packages as `cargo metadata` answers them, and the other manifests a project carries.
serde_json.workspace = true
toml.workspace = true
