# The workspace: the tool host under `host/`, the tool contract every Rust tool is written to under
# `sdk/contract/`, the control socket's client under `client/`, the harness plugin under `plugin/`, and the
# repository's own package at the root, which holds the checks that span the repository in `tests/`.
[workspace]
members = ["client", "host", "plugin", "sdk/contract"]
resolver = "3"

[workspace.package]
version = "0.1.0-rev.9"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
axum = "0.8.4"
# A schedule's time, in the host machine's local zone.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.40", features = ["derive", "env", "string"] }
# A schedule's cron pattern, read and its next time found.
croner = "4.0.1"
# The event stream's body, unfolded from the events as they are published.
futures-util = { version = "0.3.34", default-features = false }
http = "1.3.1"
http-body-util = "0.1.3"
hyper = { version = "1.6.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.16", features = ["tokio"] }
dotenvy = "0.15.7"
jsonschema = { version = "0.58.6", default-features = false }
libc = "0.2.177"
notify = { version = "8.2.0", default-features = false }
rand = "0.9.2"
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
strum = { version = "0.28.0", features = ["derive"] }
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.18"
tokio = { version = "1.47.0", features = ["macros", "rt", "rt-multi-thread", "net", "time", "signal", "io-util", "process"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
url = "2.5.8"

[package]
name = "bmo-pocket"
description = "The tool host repository's own package: the checks that span the repository."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[dev-dependencies]
# The workspace's packages as `cargo metadata` answers them, the other manifests a project carries, and the
# patterns the personal-data check reads every tracked file with.
serde_json.workspace = true
toml.workspace = true
regex = "1.13.1"

[[test]]
name = "main"
path = "tests/main.rs"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.release]
debug = false
strip = "debuginfo"
