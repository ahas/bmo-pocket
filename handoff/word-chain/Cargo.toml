# The word chain, a standalone tool: the game, its word book, the service reading the rooms' messages and saying
# the games' lines, and the `bmo-word-chain` binary. A workspace of its own, its tests in `tests/`.
[workspace]
resolver = "3"

[package]
name = "word-chain"
version = "0.1.0"
description = "The word chain game: its Hangul arithmetic, its word book, the games in the rooms and their service."
edition = "2024"
publish = false

[[bin]]
name = "bmo-word-chain"
path = "src/main.rs"
test = false

[dependencies]
# The control routes.
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
# The time the word book records it was installed at.
chrono = { version = "0.4.41", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5.40", features = ["derive", "env", "string"] }
# The receiver's event stream, read as it comes.
futures-util = "0.3.34"
rand = "0.9.2"
# The dictionary definitions' own small markup, taken out of their text.
regex = "1.11.1"
# The NIKL dictionaries' XML.
roxmltree = "0.21.1"
# The sources fetched where no copy on the disk is named, and the receiver and the web unit asked.
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
# The receiver's event stream, read as server-sent events.
sse-stream = "0.2.6"
tokio = { version = "1.47.0", features = ["macros", "rt", "rt-multi-thread", "net", "time", "sync", "io-std"] }
# The policy file and the configuration.
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3.20.0"
