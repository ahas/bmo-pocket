# The word chain, a standalone tool: the game, its word book and its installation, and the `bmo-word-chain`
# binary. A workspace of its own, its tests in `tests/`.
[workspace]
resolver = "3"

[package]
name = "word-chain"
version = "0.1.0"
description = "The word chain game: its Hangul arithmetic, its word book and the game itself."
edition = "2024"
publish = false

[[bin]]
name = "bmo-word-chain"
path = "src/main.rs"
test = false

[dependencies]
# The time the word book records it was installed at.
chrono = { version = "0.4.41", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5.40", features = ["derive", "env", "string"] }
rand = "0.9.2"
# The dictionary definitions' own small markup, taken out of their text.
regex = "1.11.1"
# The NIKL dictionaries' XML.
roxmltree = "0.21.1"
# The sources fetched where no copy on the disk is named.
reqwest = "0.13.5"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.47.0", features = ["macros", "rt", "rt-multi-thread"] }
# The policy file.
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3.20.0"
