# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.

testbed = 0
name = "word-chain"

[test]
languages = ["cargo"]

[check]
quick = ["layout", "dependencies"]
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui"]

[[check.step]]
id = "check"
command = "cargo check --all-targets"
lane = "wide"

[[check.step]]
id = "clippy"
command = "cargo clippy --all-targets -- -D warnings"
lane = "wide"

[[check.step]]
id = "fmt"
command = "cargo fmt --check"

[build]
binaries = ["bmo-word-chain"]

# The service's own deploy tree, and the data root the word book and its configuration stand under. Its user unit
# stands under deploy/ and is the repository's one service.
[deploy]
root = "~/.local/share/bmo-word-chain"
link = "deploy"
data_root = "~/.local/share/bmo/data"
units = ["deploy/*.service"]
# Answers 0 once the service answers on its control routes.
health = "~/.local/share/bmo-word-chain/deploy/bin/bmo-word-chain --data-root ~/.local/share/bmo/data health"

# The tool registered with the tool host once the service stands: the release's binary, manifest and schemas placed
# as one folder and put, which places a version of its own (the host's docs/registry.md).
[[deploy.step]]
id = "register-tool"
phase = "after-health"
command = '''
set -eu
rm -rf .tool
mkdir -p .tool
cp bin/bmo-word-chain tool.toml word_chain_start.json word_chain_stop.json .tool/
bmo pocket put .tool --placed --allow room.tools
rm -rf .tool
'''
