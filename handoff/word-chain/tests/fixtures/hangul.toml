# The Hangul tests' cases: the openings a syllable hands on under the initial-sound rule, what is a word of whole
# syllables, and a word's last final consonant.

# A rieul before yeo dropped to ieung, a rieul before a read as nieun, a nieun before yeo dropped to ieung, and
# two syllables the rule does not touch, the first being the form the rule turns into, which never turns back.
[[openings]]
syllable = "력"
openings = ["력", "역"]

[[openings]]
syllable = "락"
openings = ["락", "낙"]

[[openings]]
syllable = "녀"
openings = ["녀", "여"]

[[openings]]
syllable = "역"
openings = ["역"]

[[openings]]
syllable = "차"
openings = ["차"]

[words]
whole = ["기차"]
not_whole = ["ㅋㅋ", "기차 표", ""]

# A word ending in nieun (final 4), and one ending in no final consonant.
[[finals]]
word = "사전"
last = 4

[[finals]]
word = "기차"
last = 0
