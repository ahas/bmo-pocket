# The game tests' word book, and the words each test plays named by what each is to the game. Of the syllables a
# round opens from, only `opening` starts with one, so every round opens on it or on nothing.

book = ["기차", "차표", "표차", "표범", "범인", "차그릇", "차력", "역량", "양말"]
loanwords = ["차트"]

[words]
# The word every round opens on, and the syllable it hands on.
opening = "기차"
opening_hands = "차"
# A word following the opening word, and the syllable it hands on.
follows = "차표"
follows_hands = "표"
# Two words following `follows`.
answer = "표차"
other_answer = "표범"
# A word `other_answer` hands to, which nothing follows.
dead_end = "범인"
# A word of the right syllable the book does not hold.
not_in_book = "차차차"
# A word following the opening word whose last syllable nothing follows: a hanbang.
hanbang = "차그릇"
# A loanword following the opening word.
loanword = "차트"
# A word following the opening word whose last syllable has an initial-sound form, both forms, and a word
# starting with the form.
initial_sound = "차력"
initial_sound_hands = ["력", "역"]
initial_sound_answer = "역량"
# What is no word: letters alone, a word with talk after it, and one syllable.
letters = "ㅋㅋ"
with_talk = "차표 ㄱㄱ"
one_syllable = "차"
